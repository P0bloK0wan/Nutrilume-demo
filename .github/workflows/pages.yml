name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm test
      - name: Verificar plataforma e demonstração
        run: |
          npm start > /tmp/nutrilume-pages-server.log 2>&1 &
          python - <<'PYTEST'
          import time,urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://localhost:3000/api/config',timeout=1)
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Servidor indisponível')
          PYTEST
          BASE_URL=http://localhost:3000/demo.html python tests/seguranca.py
          BASE_URL=http://localhost:3000/demo.html python tests/comunidade.py
          BASE_URL=http://localhost:3000/demo.html python tests/alimentos.py
          BASE_URL=http://localhost:3000/demo.html python tests/regressoes.py
          python tests/platform/browser.py
      - run: node scripts/build-pages.mjs
      - run: python tests/pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
